name: Icon mapping
description: Argue with the concept-to-icon mapping in the icon guide
labels: [icons]
body:
  - type: input
    id: concept
    attributes:
      label: Which concept?
      placeholder: Tool call
    validations: { required: true }
  - type: input
    id: proposed
    attributes:
      label: Which Lucide icon should it be instead?
      placeholder: Wrench
    validations: { required: true }
  - type: textarea
    id: argument
    attributes:
      label: The argument
      description: >
        Not a preference — an argument. What does the current icon collide
        with, or fail to say? Changing a mapping changes every component that
        expresses the concept, so it needs to be worth it.
    validations: { required: true }
